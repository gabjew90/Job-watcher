name: Daily job watch

on:
  schedule:
    # Primary firing 06:37 Pacific, with a fallback at 09:37. GitHub's shared
    # cron drifts by hours and skips firings outright (2026-09-17: the single
    # slot never fired). The fallback is free when the primary ran: the title
    # screen judges only unseen titles and triage scores only new postings,
    # so a run with nothing new makes no model calls and posts no digest.
    # Claude usage is set by the day's new postings, not the run count; the
    # 2026-09-15 weekly-limit outage came from interactive sessions on the
    # same subscription. Off-the-hour minutes queue better.
    - cron: "37 13 * * *"
    - cron: "37 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Resume drafts ship as PDF converted from the DOCX by LibreOffice;
      # Carlito is metric-compatible with Calibri so the PDF paginates like
      # Word. About a minute per run; only draft requests use it.
      - name: Install LibreOffice Writer (resume PDFs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer fonts-crosextra-carlito

      - name: Install Claude Code CLI (triage)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m src.main

      - name: Commit state and dashboard
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- state docs data drafts config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily run $(date -u +%F)"
            # A concurrent run may have pushed since checkout; rebase our
            # snapshot on top (preferring our fresher scrape on conflicts).
            n=0
            until git push; do
              n=$((n+1)); [ "$n" -ge 3 ] && exit 1
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            done
          fi
