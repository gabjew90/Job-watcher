name: Daily job watch

on:
  schedule:
    # Four firings/day: GitHub's shared cron is unreliable — observed
    # drifting 3+ hours AND skipping firings entirely. Redundancy is the
    # only in-platform mitigation; dedupe makes extra runs nearly free
    # (they score only what is new) and a digest posts only when a run
    # actually finds something. Off-the-hour minutes queue better.
    - cron: "37 13 * * *"
    - cron: "37 17 * * *"
    - cron: "37 21 * * *"
    - cron: "37 01 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI (triage)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m src.main

      - name: Commit state and dashboard
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- state docs data drafts
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily run $(date -u +%F)"
            # A concurrent run may have pushed since checkout; rebase our
            # snapshot on top (preferring our fresher scrape on conflicts).
            n=0
            until git push; do
              n=$((n+1)); [ "$n" -ge 3 ] && exit 1
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            done
          fi
